# ใช้แทน Dockerfile เดิมเมื่อ AnyaWave บิลด์ผ่านแล้ว (เปลี่ยนชื่อเป็น Dockerfile)
# ใช้อิมเมจทางการเป็นฐาน (มี Java, ไลบรารีเนทีฟ และ glibc ที่ DAVE ต้องการ) แล้วเอา jar ของเราทับ
FROM ghcr.io/lavalink-devs/lavalink:4.2.2
# แก้ YOUR_GITHUB_NAME เป็นชื่อ GitHub ของคุณ (repo ต้องเป็น public ถึงจะโหลดได้)
ADD --chown=lavalink:lavalink https://github.com/catlookkas24-beluga/AnyaWave/releases/download/latest/Lavalink.jar /opt/Lavalink/Lavalink.jar
COPY --chown=lavalink:lavalink application.yml /opt/Lavalink/application.yml
COPY --chown=lavalink:lavalink start.sh /opt/Lavalink/start.sh
RUN chmod +x /opt/Lavalink/start.sh
ENV JAVA_TOOL_OPTIONS="-Xmx350m -XX:+UseSerialGC"
ENTRYPOINT ["/opt/Lavalink/start.sh"]
CMD []